# main dalina her gonderimde web surumunu derler ve GitHub Pages'te yayinlar.
name: Web surumu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Testler
        run: dotnet test tests/UyumEslestirme.Tests
      - name: Web surumunu yayinla
        run: dotnet publish src/UyumEslestirme.Web -c Release -o cikti
      - name: Pages dosyalari
        run: |
          touch cikti/wwwroot/.nojekyll
          cp cikti/wwwroot/index.html cikti/wwwroot/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cikti/wwwroot

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - id: yayin
        uses: actions/deploy-pages@v4
